<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentDataDashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="Assets/CSS/style.css">
</head>

<body>
    <nav class="navbar md:navbar-expand justify-content-end bg-primary">
        <div class="container">
            <a href="#" class="tittle brand navbar-brand fs-xl text">
                <i class="fa-solid fa-graduation-cap"></i>
                Student Dashboard
            </a>
        </div>
    </nav>
    <main>
        <section class="py-5 bg-light">
            <div class="container">
                <div class="box bg-white">
                    <div class="head">
                        <h1 class="h3 fg-primary">Daftar Nilai Siswa</h1>
                        <div class="input">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input id="searchInput" type="search" class="search" placeholder="Cari nama siswa">
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Siswa</th>
                                <th>Kelas</th>
                                <th>Nilai(Score)</th>
                            </tr>
                        </thead>
                        <tbody id="studentTable"></tbody>
                    </table>
                    <div class="table-footer">
                        <span>Rata-rata Nilai Kelas:</span>
                        <span id="averageScore" class="average-badge">0</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="Assets/JS/script.js"></script>
</body>

</html>
